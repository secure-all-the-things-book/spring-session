<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Authenticated Chat</title>

    <style>
        #chat {
            display: grid;
            gap: .5em;
            justify-items: start;
        }

        #chat > #prompt,
        #chat > #chat-box,
        #chat > #messageInput {
            width: 100%;
            box-sizing: border-box;
        }

        #chat > button {
            justify-self: start;
        }

        #chat-box {
            padding: .5em;
            border: 1px solid black;
            height: 10em;
            overflow-y: scroll;
        }
    </style>
</head>
<body>
<div id="chat">
    <div id="prompt">
        <h2>WebSocket Chat</h2>
        <p>Logged in as: <strong th:text="${username}" id="username">User</strong></p>
    </div>
    <div id="chat-box"></div>
    <input type="text" id="messageInput" placeholder="Type a message..."/>
    <button onclick="send()">Send</button>
</div>
<script>
    function load(src) {
        return new Promise(ok => {
            const s = document.createElement('script');
            s.src = src;
            s.onload = ok;
            document.head.appendChild(s);
        })
    }

    function startChat() {
        const box = document.getElementById('chat-box'),
            input = document.getElementById('messageInput');
        const stomp = Stomp.over(new SockJS('/messages'));
        stomp.connect({}, () => stomp.subscribe('/topic/public', m => {
            const {sender, content} = JSON.parse(m.body);
            box.insertAdjacentHTML('beforeend',
                `<div><span class="sender">${sender}:</span> ${content}</div>`);
            box.scrollTop = box.scrollHeight;
        }));
        window.send = () => {
            const content = input.value.trim();
            if (content) stomp.send('/app/send', {}, JSON.stringify({content}));
            input.value = '';
        };
    }
    const cdn = 'https://cdnjs.cloudflare.com/ajax/libs/';
    const promises = ['sockjs-client/1.6.1/sockjs.min.js', 'stomp.js/2.3.3/stomp.min.js']
        .map(src => load(cdn + src));
    Promise.all(promises).then(startChat);
</script>
</body>
</html>
